<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HOODLY | Streetwear</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>HOODLY</h1>
    <nav>
      <a href="#shop">Shop</a>
      <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Built for the Streets</h2>
    <p>Premium hoodies. Minimal design.</p>
  </section>

  <section id="shop" class="products">
    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Hoodie">
      <h3>Classic Black Hoodie</h3>
      <p>$59</p>
      <button onclick="addToCart('Classic Black Hoodie', 59)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/300" alt="Hoodie">
      <h3>Grey Oversized Hoodie</h3>
      <p>$65</p>
      <button onclick="addToCart('Grey Oversized Hoodie', 65)">Add to Cart</button>
    </div>
  </section>

  <section id="cart" class="cart">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <h3>Total: $<span id="total">0</span></h3>

    <button class="pay-btn" onclick="checkout()">Pay Now</button>
  </section>

  <footer>
    <p>© 2025 HOODLY</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
